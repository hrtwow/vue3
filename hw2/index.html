<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title></title>
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.1.3/dist/css/bootstrap.min.css">
  <link rel="stylesheet" href="./style.css">

</head>
<body>
  <div id="app" v-cloak>
    <!-- Vue 尚未掛載（compile/渲染）完成前，先暫時隱藏模板內容，避免使用者看到原始模板語法
    Vue 掛載完成後會自動移除 v-cloak 屬性-->
    <div v-if="isLoggedIn" class="container">
      <div class="row py-3">
        <div class="col-md-6">
          <h2>產品列表</h2>
          <table class="table table-hover mt-4">
            <thead>
              <tr>
                <th width="150">產品名稱</th>
                <th width="120">原價</th>
                <th width="120">售價</th>
                <th width="150">是否啟用</th>
                <th width="120">查看細節</th>
              </tr>
            </thead>
            <tbody>
              <tr v-for="item in products">
                <td width="150">{{ item.title }}</td>
                <td width="120">{{ item.origin_price }}</td>
                <td width="120">{{ item.price }}</td>
                <td width="150">
                  <span class="text-success">啟用</span>
                  <span>未啟用</span>
                </td>
                <td width="120">
                  <button type="button" class="btn btn-primary" @click="tempProduct=item">查看細節</button>
                </td>
              </tr>
            </tbody>
          </table>
          <p>目前有 <span>{{ products.length }}</span> 項產品</p>
        </div>
        <div class="col-md-6">
          <h2>單一產品細節</h2>
          <template v-if="tempProduct.title">
            <div class="card mb-3">
              <img :src="tempProduct.imageUrl" class="card-img-top primary-image" alt="主圖">
              <div class="card-body">
                <h5 class="card-title">
                  {{ tempProduct.title }}
                  <span class="badge bg-primary ms-2">{{ tempProduct.category }}</span>
                </h5>
                <p class="card-text">商品描述：{{ tempProduct.description }}</p>
                <p class="card-text">商品內容：{{ tempProduct.content }}</p>
                <div class="d-flex">
                  <p class="card-text me-2">{{ tempProduct.price }}</p>
                  <p class="card-text text-secondary"><del>{{ tempProduct.origin_price }}</del></p>
                  元 / {{ tempProduct.unit }}
                </div>
              </div>
            </div>
            <template v-for="img in tempProduct.imagesUrl">  <!-- 為何可以用v-for 在 template -->
              <img :src="img" alt="" class="images m-2">
            </template>
          </template>
          <p v-else class="text-secondary">請選擇一個商品查看</p> <!-- v-else 為何可以寫在另一個元素 -->
        </div> 
      </div>
    </div>
    <div v-else>
    </div>

    <!-- 登入提示 Modal -->
    <div v-if="showModal" class="modal-backdrop">
      <div class="modal-custom">
        <div class="modal-header">
        </div>
        <div class="modal-body">
          {{ errorMsg }}
        </div>
        <div class="modal-footer">
          <button class="btn btn-primary" @click="login">前往登入</button>
        </div>
      </div>
    </div>
  </div>

  <script src="https://unpkg.com/axios/dist/axios.min.js"></script>
  <script type="module" src="./main.js"></script>
  <!-- 如果 main.js 裡面有使用 import / export，就一定要寫 type="module" -->
</body>
</html>
