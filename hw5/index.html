<!DOCTYPE html>
<html lang="zh-Hant-TW">

<head>
  <meta charset="UTF-8">
  <meta http-equiv="X-UA-Compatible" content="IE=edge">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/css/bootstrap.min.css" rel="stylesheet"
    integrity="sha384-eOJMYsd53ii+scO/bJGFsiCZc+5NDVN2yr8+0RDqr0Ql0h+rP48ckxlpbzKgwra6" crossorigin="anonymous">
  <link rel='stylesheet' href='https://cdnjs.cloudflare.com/ajax/libs/font-awesome/5.9.0/css/all.min.css'
    integrity='sha512-q3eWabyZPc1XTCmF+8/LuE1ozpg5xxn7iO89yfSOd5/oKvyqLngoNGsx8jq92Y8eXJ/IRxQbEC+FGSYxtk2oiw=='
    crossorigin='anonymous' />
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/vue-loading-overlay/dist/css/index.css" />
  <style>
    .cart-area-loading {
      opacity: 0.4;
      pointer-events: none;
    }
  </style>
</head>

<body>
  <div id="app">

    <loading :active="isLoading" background-color="rgba(0,0,0,0.7)">
    </loading>

    <div class="container">
      <div class="mt-4">

        <table class="table align-middle">
          <thead>
            <tr>
              <th>圖片</th>
              <th>商品名稱</th>
              <th>價格</th>
              <th></th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="product in products">
              <td style="width: 200px">
                <div style="height: 100px; background-size: cover; background-position: center"
                  :style="{backgroundImage: `url(${product.imageUrl})`}"></div>
              </td>
              <td>
                {{ product.title }}
              </td>
              <td>
                <div class="h5" v-if="product.origin_price===product.price">{{ product.price }} 元</div>
                <div v-else> <!-- 原價售價不同才顯示刪除線-->
                  <del class="h6">原價 {{ product.origin_price }} 元</del>
                  <div class="h5">現在只要 {{ product.price }} 元</div>
                </div>
              </td>
              <td>
                <div class="btn-group btn-group-sm">
                  <button type="button" class="btn btn-outline-secondary" @click="openModal(product)">
                    <!-- <i class="fas fa-spinner fa-pulse"></i> -->
                    查看更多
                  </button>
                  <button 
                    type="button" 
                    class="btn btn-outline-danger" 
                    @click="addToCart(product.id, 1)" 
                    :disabled="product.id === btnStatus.addToCartLoading"
                  > <!-- 局部loading btn , 選到的那筆要加上 disabled屬性-->
                    <span 
                      class="spinner-border spinner-border-sm" 
                      role="status" 
                      aria-hidden="true" v-if="product.id === btnStatus.addToCartLoading">
                    </span> <!-- 局部loading bootstrap spinner, 選到的那筆要加上特效-->
                    加到購物車
                  </button>
                </div>
              </td>
            </tr>
          </tbody>
        </table>

        <!-- 購物車列表 -->
        <div class="cart-area" :class="{ 'cart-area-loading': cartLoading }">

        <div class="text-end">
          <button class="btn btn-outline-danger" type="button" @click="removeAll">清空購物車</button>
        </div>
        <table class="table align-middle">
          <thead>
            <tr>
              <th></th>
              <th>品名</th>
              <th style="width: 150px">數量/單位</th>
              <th>單價</th>
            </tr>
          </thead>
          <tbody>
            <tr v-for="item in cart.carts">
              <td>
                <button type="button" class="btn btn-outline-danger btn-sm" @click="remove(item.id)">
                  <!-- <i class="fas fa-spinner fa-pulse"></i> -->
                  x
                </button>
              </td>
              <td>
                {{ item.product.title }}
                <!-- <div class="text-success">已套用優惠券</div> -->
              </td>
              <td>
                <div class="input-group input-group-sm">
                  <div class="input-group mb-3">
                    <input 
                      min="1" 
                      type="number" 
                      class="form-control" 
                      v-model="item.qty" 
                      @change="changeCartQty(item)"
                      :disabled="item.id === btnStatus.updateQtyLoading"
                      @input="onQtyInput($event, item)"
                    >
                    
                    <span class="input-group-text" id="basic-addon2">{{item.product.unit}}</span>
                  </div>
                </div>
              </td>
              <td class="text-end">
                <!-- <small class="text-success">折扣價：</small> -->
                {{ item.total }}
              </td>
            </tr>
          </tbody>
          <tfoot>
            <tr>
              <td colspan="3" class="text-end">總計</td>
              <td class="text-end">{{ cart.total }}</td>
            </tr>
            <!-- <tr>
              <td colspan="3" class="text-end text-success">折扣價</td>
              <td class="text-end text-success">{{ cart.final_total }}</td>
            </tr> -->
          </tfoot>
        </table>
        </div>
      </div>


      <div class="my-5 row justify-content-center">
        <v-form ref="form" class="col-md-6" v-slot="{ errors }" @submit="onSubmit">{{errors}}
          <!-- v-slot 是物件，裝的就是各個 v-field name 對應的錯誤訊息, key 是 v-field name 
          :class的errors['email'] 是去v-slot errors 物件抓 key=email的錯誤訊息, 
          error-message name="email"也是去v-slot errors 物件抓key=email的錯誤訊息 -->
          <div class="mb-3">
            <label for="email" class="form-label">Email</label>
            <v-field id="email" name="email" type="email" v-model="user.email" class="form-control"
                    :class="{ 'is-invalid': errors['email'] }" placeholder="請輸入 Email"
                    rules="myEmail|mustFill"
                    ></v-field>
            <error-message name="email" class="invalid-feedback"></error-message>
            <!-- error-message name="email" 對應 v-field name="email" -->
          </div>

          <div class="mb-3">
            <label for="name" class="form-label">收件人姓名</label>
            <!-- 程式用name, 錯誤訊息用收件人姓名 -->
            <v-field id="name" name="name" type="text" v-model="user.name" class="form-control" :class="{ 'is-invalid': errors['name'] }"
                      placeholder="請輸入姓名" rules="required"></v-field>
            <error-message name="name" class="invalid-feedback"></error-message>
          </div>

          <div class="mb-3">
            <label for="tel" class="form-label">收件人手機號碼</label>
            <v-field id="tel" name="手機號碼" type="text" v-model="user.tel" class="form-control" :class="{ 'is-invalid': errors['手機號碼'] }"
                      placeholder="請輸入手機號碼" :rules="isPhoneValid"></v-field>
            <error-message name="手機號碼" class="invalid-feedback"></error-message>
          </div>

          <!-- <div class="mb-3">
            <label for="address" class="form-label">收件人地址</label>
            <v-field id="address" name="地址" type="text" class="form-control" :class="{ 'is-invalid': errors['地址'] }"
                      placeholder="請輸入地址" rules="required" ></v-field>
            <error-message name="地址" class="invalid-feedback"></error-message>
          </div> -->
          
          <div class="mb-3">
            <label for="region" class="form-label">收件人地區</label>
              <!-- VeeValidate names (zh_TW.json) 來做欄位名稱翻譯 => 程式用region, 錯誤訊息用地區 -->
              <v-field
                id="region"
                name="region"
                v-model="user.region"
                class="form-control"
                :class="{ 'is-invalid': errors['region'] }"
                placeholder="請輸入地區"
                rules="mustFill"
                v-model="user.region"
                as="select"
              >
                <option value="">請選擇地區</option>
                <option value="taipei">台北市</option>
                <option value="kaohsiung">高雄市</option>
              </v-field>
              <error-message name="region" class="invalid-feedback"></error-message>
          </div>

          <div class="mb-3">
            <label for="message" class="form-label">留言</label>
            <textarea id="message" v-model="user.message" class="form-control" cols="30" rows="10" ></textarea>
          </div>
          <div class="text-end">
            <button type="submit" class="btn btn-danger">送出訂單</button>
            <!-- type必須是submit才會觸發 VeeValidate 的 <Form> 預設的submit 事件 -->
          </div>
        </v-form>
      </div>
    </div>

    <!-- 產品Modal -->

    <!-- 產品Modal -->
    <user-modal :temp-product="p" @add-to-cart="addToCart" ref="pModal"></user-modal>
  </div>

  <script type="text/x-template" id="userProductModal">
    <div class="modal fade" id="productModal" tabindex="-1" role="dialog" aria-labelledby="exampleModalLabel" aria-hidden="true" ref="modal">
        <div class="modal-dialog modal-xl" role="document">
          <div class="modal-content border-0">
            <div class="modal-header bg-dark text-white">
              <h5 class="modal-title" id="exampleModalLabel">
                <span>{{ tempProduct.title }}</span>
              </h5>
              <button type="button" class="btn-close" data-bs-dismiss="modal" aria-label="Close"></button>
            </div>
            <div class="modal-body">
              <div class="row">
                <div class="col-sm-6">
                  <img class="img-fluid" :src="tempProduct.imageUrl" alt="">
                </div>
                <div class="col-sm-6">
                  <span class="badge bg-primary rounded-pill">{{ tempProduct.category }}</span>
                  <p>商品描述：{{ tempProduct.description }}</p>
                  <p>商品內容：{{ tempProduct.content }}</p>
                  <div class="h5" v-if="tempProduct.origin_price===tempProduct.price">{{ tempProduct.price }} 元</div>
                  <div v-else>
                    <del class="h6">原價 {{ tempProduct.origin_price }} 元</del>
                    <div class="h5">現在只要 {{ tempProduct.price }} 元</div>
                  </div>
                  <div>
                    <div class="input-group">
                      <!-- <input type="number" class="form-control" min="1" v-model="num"> 其實通常會用下拉選單 -->
                      <select class="form-select" v-model="num">
                        <option v-for="i in 10" :value="i">{{i}}</option> <!-- 當你選某個 <option>，num 就會等於該 <option> 的 value -->
                      </select>
                      <button type="button" class="btn btn-primary" @click="add(tempProduct.id, num)">加入購物車</button>
                    </div>
                  </div>
                </div>
                <!-- col-sm-6 end -->
              </div>
            </div>
          </div>
        </div>
    </div>
  </script>

  <script src='https://cdnjs.cloudflare.com/ajax/libs/axios/0.9.1/axios.min.js'
    integrity='sha512-Xk3wWei2TGrsh9kDSBKUMIjw/86sLUvhtnv9f7fOuIwhhiUTKz8szkWkzHthrM5Bb3Bu9idSzkxOrkzhcneuiw=='
    crossorigin='anonymous'></script>
  <script src="https://cdn.jsdelivr.net/npm/@popperjs/core@2.9.1/dist/umd/popper.min.js"
    integrity="sha384-SR1sx49pcuLnqZUnnPwx6FCym0wLsk5JZuNx2bPPENzswTNFaQU1RDvt3wT4gWFG"
    crossorigin="anonymous"></script>
  <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.0.0-beta3/dist/js/bootstrap.min.js"
    integrity="sha384-j0CNLUeiqtyaRmlzUHCPZ+Gy5fQu0dQ6eZ/xAww941Ai1SxSY+0EQqNXNE6DZiVc"
    crossorigin="anonymous"></script>
  <!-- <script src="https://unpkg.com/vue@next"></script> -->
  <!-- <script src="https://unpkg.com/vee-validate@next"></script> -->
  <!-- <script src="https://unpkg.com/@vee-validate/i18n@4.1.0"></script> -->
  <!-- <script src="https://unpkg.com/@vee-validate/rules"></script> -->
  <script src="https://unpkg.com/vue@3/dist/vue.global.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/vue-loading-overlay@6.0.6/dist/index.min.js"></script>

  <!-- VeeValidation-->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/vee-validate/4.12.4/vee-validate.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@vee-validate/rules@4.12.4/dist/vee-validate-rules.min.js"></script>
  <script src="https://cdn.jsdelivr.net/npm/@vee-validate/i18n@4.12.4/dist/vee-validate-i18n.min.js"></script>


  <script src="./main.js" type="module"></script>
</body>

</html>
